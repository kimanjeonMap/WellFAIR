# root-context.xml 의 property-placeholder 가 읽는다. Java 에서는 @Value("${app.naver.client-id}") 로 사용.

# 네이버 지도 JS API v3 Client ID (ncpKeyId).
# 네이버 클라우드 콘솔 > Web 서비스 URL 에 http://localhost:8080 등록 필요.
# SDK: https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=<client-id>
# 주의: 'qttr0pq1es' 의 5번째 글자는 숫자 0 (영문 O 아님). 영문 O 로 쓰면 SDK 가 500 / 인증 실패를 돌려준다.
app.naver.client-id=qttr0pq1es

# 취약 점수 기준점(100점 만점). 이 점수 이상인 건물만 마커로 표시
app.analysis.score-min=80

# TMAP (SK open API) appKey : 현장확인 동선을 실제 도보 경로로 그린다 (RouteService, 서버에서만 호출)
# https://openapi.sk.com > 로그인 > 내 앱 > 앱 만들기 > TMAP API 사용 신청 후 나오는 appKey 를 붙여넣는다.
# 비워 두면 지금처럼 직선(점선)으로 그린다.
app.tmap.app-key=HP0rye1Gz02CpDVv7iklI3jYzv45ZpoI3g8V36OD
